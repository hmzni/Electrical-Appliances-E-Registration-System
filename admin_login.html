<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/64d58efce2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="index.css">
    <style>
        .input-field {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
    </style>
    <title>Sign in & Sign up Form</title>
</head>
<body>
    <div class="container">
        <div class="forms-container">
            <div class="signin-signup">
                <form action="login.php" method="post" class="sign-in-form">
                    <h2 class="title">Admin Sign in</h2>
                    <input type="hidden" name="user_type" value="admin">
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" name="id" placeholder="Admin ID">
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Password" id="password-login">
                        <i class="fas fa-eye toggle-password" id="toggle-password-login"></i>
                    </div>
                    <input type="submit" value="Login" class="btn solid">
                   <a href="forgot_password.php?user_type=admin" class="forgot-password-link">Forgot Password?</a>
                </form>

                <!-- Admin Sign Up Form -->
                <form action="signup.php" method="post" class="sign-up-form" onsubmit="return validatePassword()">
                    <h2 class="title">Sign up</h2>
                    <input type="hidden" name="user_type" value="admin">
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" name="id" placeholder="Admin ID" required>
                    </div>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" name="full_name" placeholder="Full Name" required>
                    </div>
                    <div class="input-field">
                        <i class="fas fa-phone"></i>
                        <input type="text" name="phone_number" placeholder="Phone Number" required>
                    </div>
                    <div class="input-field">
                        <i class="fas fa-university"></i>
                        <select name="faculty_or_department" required>
                            <option value="HR">HR</option>
                            <option value="IT">IT</option>
                            <option value="Finance">Finance</option>
                            <option value="Operations">Operations</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Create Password" id="password-signup" required>
                        <i class="fas fa-eye toggle-password" id="toggle-password-signup"></i>
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="confirm_password" placeholder="Confirm Password" id="confirm-password-signup" required>
                        <i class="fas fa-eye toggle-password" id="toggle-confirm-password-signup"></i>
                    </div>
                    <input type="submit" class="btn" value="Sign up">
                </form>
            </div>
        </div>

        <div class="panels-container">
            <div class="panel left-panel">
                <div class="content">
                    <h3>New here ?</h3>
                    <p>Register as an admin to manage the system and ensure smooth operations.</p>
                    <button class="btn transparent" id="sign-up-btn">Sign up</button>
                </div>
                <img src="education.svg" class="image" alt="">
            </div>
            <div class="panel right-panel">
                <div class="content">
                    <h3>One of us ?</h3>
                    <p>Welcome back! To manage your appliances and access your personalized dashboard, please sign in to your account.</p>
                    <button class="btn transparent" id="sign-in-btn">Sign in</button>
                </div>
                <img src="mathematics.svg" class="image" alt="">
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePasswordLogin = document.getElementById('toggle-password-login');
            const togglePasswordSignup = document.getElementById('toggle-password-signup');
            const toggleConfirmPasswordSignup = document.getElementById('toggle-confirm-password-signup');
            const passwordFieldLogin = document.getElementById('password-login');
            const passwordFieldSignup = document.getElementById('password-signup');
            const confirmPasswordFieldSignup = document.getElementById('confirm-password-signup');

            togglePasswordLogin.addEventListener('click', function() {
                if (passwordFieldLogin.type === 'password') {
                    passwordFieldLogin.type = 'text';
                    togglePasswordLogin.classList.remove('fa-eye');
                    togglePasswordLogin.classList.add('fa-eye-slash');
                } else {
                    passwordFieldLogin.type = 'password';
                    togglePasswordLogin.classList.remove('fa-eye-slash');
                    togglePasswordLogin.classList.add('fa-eye');
                }
            });

            togglePasswordSignup.addEventListener('click', function() {
                if (passwordFieldSignup.type === 'password') {
                    passwordFieldSignup.type = 'text';
                    togglePasswordSignup.classList.remove('fa-eye');
                    togglePasswordSignup.classList.add('fa-eye-slash');
                } else {
                    passwordFieldSignup.type = 'password';
                    togglePasswordSignup.classList.remove('fa-eye-slash');
                    togglePasswordSignup.classList.add('fa-eye');
                }
            });

            toggleConfirmPasswordSignup.addEventListener('click', function() {
                if (confirmPasswordFieldSignup.type === 'password') {
                    confirmPasswordFieldSignup.type = 'text';
                    toggleConfirmPasswordSignup.classList.remove('fa-eye');
                    toggleConfirmPasswordSignup.classList.add('fa-eye-slash');
                } else {
                    confirmPasswordFieldSignup.type = 'password';
                    toggleConfirmPasswordSignup.classList.remove('fa-eye-slash');
                    toggleConfirmPasswordSignup.classList.add('fa-eye');
                }
            });

            function validatePassword() {
                const password = document.getElementById('password-signup').value;
                const confirmPassword = document.getElementById('confirm-password-signup').value;
                if (password !== confirmPassword) {
                    alert("Passwords do not match. Please make sure both passwords are the same.");
                    return false;
                }
                return true;
            }
        });
    </script>

    <script src="app.js"></script>
</body>
</html>
