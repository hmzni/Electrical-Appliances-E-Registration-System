<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Selection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #FCA4A6; /* Background color */
            background: linear-gradient(135deg, #FCA4A6 0%, #FF7F7F 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.3s ease-in-out;
        }

        .container:hover {
            transform: scale(1.05);
        }

        h1 {
            color: #444;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .button-container {
            margin-top: 20px;
        }

        .button {
            padding: 15px 30px;
            margin: 0 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background-color: #FF69B4; /* Pink color for buttons */
            color: #fff;
            font-size: 1rem;
            text-transform: uppercase;
            transition: background-color 0.3s, transform 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-decoration: none; /* Remove underline */
        }

        .button:hover {
            background-color: #FF1493; /* Darker pink on hover */
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Electrical Appliances E-Registration</h1>
    <p>Please select your user type:</p>
    <div class="button-container">
        <a href="student_login.html" class="button">Student</a>
        <a href="admin_login.html" class="button">Administrator</a>
    </div>
</div>
</body>
</html>
